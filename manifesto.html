<!DOCTYPE html>
<html lang="en-gb">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exquisite Corpse - Redirecting...</title>
    <meta http-equiv="refresh" content="0;url=./about.html#manifesto">
    <script type="text/javascript">
        window.location.replace("./about.html#manifesto");
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fbfbfb;
            color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .redirect-container {
            text-align: center;
            max-width: 400px;
            padding: 2rem;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        p {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        a {
            color: #000;
            text-decoration: underline;
            font-weight: 500;
        }
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 2px solid rgba(0,0,0,.1);
            border-radius: 50%;
            border-top-color: #000;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 1.5rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
<script>
(function() {
  var stored = localStorage.getItem('sao-theme');
  var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  var useDark = stored ? (stored === 'dark') : prefersDark;
  if (useDark) document.documentElement.classList.add('dark-init');
  document.addEventListener('DOMContentLoaded', function() {
    if (useDark) {
      document.body.classList.add('dark-mode');
      document.documentElement.classList.remove('dark-init');
    }
  });
})();
</script>
</head>
<body>
    <div class="redirect-container">
        <div class="spinner"></div>
        <h1>Redirecting to Manifesto</h1>
        <p>The project manifesto has been integrated into the About page. You are being redirected to the unified section.</p>
        <p>If you are not redirected automatically within a few seconds, please click <a href="./about.html#manifesto">here</a>.</p>
    </div>
</body>
</html>
